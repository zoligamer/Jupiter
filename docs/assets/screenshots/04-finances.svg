    <text x="74" y="56" fill="#f59e0b" font-family="sans-serif" font-size="12">Határidő: 2026.11.15. (11 nap van hátra)</text>
    <text x="330" y="44" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">3 500 Ft</text>
    <rect x="260" y="54" width="70" height="20" rx="10" fill="#f59e0b" fill-opacity="0.25" />
    <text x="295" y="68" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">FIZETENDŐ</text>
  </g>

  <!-- Intelligent Summary Info -->
  <g transform="translate(20, 545)">
    <rect width="350" height="80" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">💡 Intelligens Pénzügyi Szétválasztás</text>
    <text x="16" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">A Jupiter nem mossa össze az ösztöndíjat a tandíjjal.</text>
    <text x="16" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="11">A gyűjtőszámlás belső utalások nincsenek duplán számolva!</text>
  </g>

  <!-- Bottom Jiggly Bar -->
  <rect x="16" y="750" width="358" height="66" rx="33" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">📅</text>
  <text x="144" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">⭐</text>
  <text x="210" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">📑</text>
  <circle cx="268" cy="783" r="22" fill="#f97316" />
  <text x="268" y="788" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">💳</text>
  <text x="322" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
</svg>
