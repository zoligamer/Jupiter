    <text x="74" y="56" fill="#94a3b8" font-family="sans-serif" font-size="12">Gyűjtőszámláról • 2026.09.28.</text>
    <text x="330" y="44" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">-1 800 Ft</text>
    <rect x="282" y="54" width="48" height="20" rx="10" fill="#64748b" fill-opacity="0.25" />
    <text x="306" y="68" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">KIFIZETVE</text>
  </g>

  <!-- Expense Item (Upcoming Payable) -->
  <g transform="translate(20, 442)">
    <rect width="350" height="88" rx="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="40" cy="44" r="20" fill="#f59e0b" fill-opacity="0.2" />
