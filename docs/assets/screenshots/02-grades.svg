<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#gBg)" />

  <!-- Status Bar -->
  <text x="28" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="340" cy="34" r="4" fill="#10b981" />
  <rect x="352" y="28" width="18" height="10" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="354" y="30" width="10" height="6" rx="1.5" fill="#e2e8f0" />

  <!-- Top App Bar -->
  <text x="24" y="86" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Jegyek és Átlagok</text>
  <rect x="270" y="66" width="96" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <text x="318" y="84" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">👻 SZELLEMJEGY</text>

  <!-- 3-Column Stats Dashboard -->
  <g transform="translate(20, 110)">
    <rect width="350" height="96" rx="18" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />

    <!-- Col 1: Súlyozott átlag -->
    <text x="20" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">SÚLYOZOTT</text>
    <text x="20" y="60" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="800">4.52</text>
    <text x="82" y="58" fill="#10b981" font-family="sans-serif" font-size="14">🔥</text>
    <text x="20" y="82" fill="#34d399" font-family="sans-serif" font-size="11">+0.28 szimulálva</text>

    <!-- Divider -->
    <line x1="130" y1="20" x2="130" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Col 2: Korrigált kreditindex -->
    <text x="145" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">ÖSZTÖNDÍJ-INDEX</text>
    <text x="145" y="60" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="800">4.35</text>
    <text x="145" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="11">I. Kategória</text>

    <!-- Divider -->
    <line x1="255" y1="20" x2="255" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Col 3: Kreditek -->
    <text x="270" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">KREDITEK</text>
    <text x="270" y="60" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">28<tspan font-size="16" fill="#64748b">/30</tspan></text>
    <text x="270" y="82" fill="#38bdf8" font-family="sans-serif" font-size="11">93% teljesítve</text>
  </g>

  <!-- Ghost Simulator Banner -->
  <g transform="translate(20, 222)">
    <rect width="350" height="42" rx="12" fill="url(#badgeGrad)" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1" />
    <text x="18" y="26" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="600">👻 Szellemjegy szimulátor aktív: 2 tervezett vizsga</text>
  </g>

  <!-- Grade Cards List -->
  <!-- Card 1 (Grade 5) -->
  <g transform="translate(20, 280)">
    <rect width="350" height="92" rx="16" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="48" height="60" rx="12" fill="#10b981" />
    <text x="40" y="56" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">5</text>
    <text x="76" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Szoftverarchitektúrák</text>
    <text x="76" y="54" fill="#94a3b8" font-family="sans-serif" font-size="12">5 Kredit • Gyakorlati jegy • Kiváló</text>
    <text x="76" y="74" fill="#34d399" font-family="sans-serif" font-size="11">Beírva: 2026.11.02. 14:20</text>
  </g>

  <!-- Card 2 (Ghost Grade 5) -->
  <g transform="translate(20, 386)">
    <rect width="350" height="92" rx="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 3" />
    <rect x="16" y="16" width="48" height="60" rx="12" fill="#8b5cf6" />
    <text x="40" y="56" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">5</text>
    <text x="76" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Analízis I. (Szellemjegy)</text>
    <text x="76" y="54" fill="#c4b5fd" font-family="sans-serif" font-size="12">6 Kredit • Tervezett vizsgajegy</text>
    <text x="76" y="74" fill="#fbbf24" font-family="sans-serif" font-size="11">Cél: megtartani a 4.5+ ösztöndíjat</text>
  </g>

  <!-- Card 3 (Grade 4) -->
  <g transform="translate(20, 492)">
    <rect width="350" height="92" rx="16" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="48" height="60" rx="12" fill="#3b82f6" />
    <text x="40" y="56" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">4</text>
    <text x="76" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Adatbázisok tervezése</text>
    <text x="76" y="54" fill="#94a3b8" font-family="sans-serif" font-size="12">4 Kredit • Zárthelyi átlag • Jó</text>
    <text x="76" y="74" fill="#60a5fa" font-family="sans-serif" font-size="11">Beírva: 2026.10.28.</text>
  </g>

  <!-- Card 4 (Ghost Grade 4) -->
  <g transform="translate(20, 598)">
    <rect width="350" height="92" rx="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 3" />
    <rect x="16" y="16" width="48" height="60" rx="12" fill="#8b5cf6" />
    <text x="40" y="56" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">4</text>
    <text x="76" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Mesterséges Intelligencia</text>
    <text x="76" y="54" fill="#c4b5fd" font-family="sans-serif" font-size="12">5 Kredit • Tervezett vizsgajegy</text>
    <text x="76" y="74" fill="#a78bfa" font-family="sans-serif" font-size="11">Kattints a jegy módosításához</text>
  </g>

  <!-- Bottom Jiggly Bar -->
  <rect x="16" y="750" width="358" height="66" rx="33" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">📅</text>
  <circle cx="144" cy="783" r="22" fill="#f97316" />
  <text x="144" y="788" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">⭐</text>
  <text x="210" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">📑</text>
  <text x="268" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">💳</text>
  <text x="322" y="788" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
</svg>
