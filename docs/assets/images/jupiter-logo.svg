<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="jupSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atmosphere Glow -->
  <circle cx="50" cy="50" r="38" fill="#f97316" opacity="0.18" filter="url(#glow)" />

  <!-- Planet Sphere -->
  <circle cx="50" cy="50" r="34" fill="url(#jupSphere)" />

  <!-- Jovian Cloud Bands -->
  <path d="M 18,41 Q 50,47 82,41 Q 50,44 18,41 Z" fill="#fed7aa" opacity="0.65" />
  <path d="M 16.5,47 Q 50,54 83.5,47 Q 50,50 16.5,47 Z" fill="#7c2d12" opacity="0.5" />
  <path d="M 17,55 Q 50,62 83,55 Q 50,58 17,55 Z" fill="#ffedd5" opacity="0.75" />
  <path d="M 21,63 Q 50,69 79,63 Q 50,66 21,63 Z" fill="#9a3412" opacity="0.45" />

  <!-- Great Red Spot -->
  <ellipse cx="66" cy="57" rx="7.5" ry="4.5" fill="#b91c1c" />
  <ellipse cx="66" cy="57" rx="5" ry="2.5" fill="#ef4444" opacity="0.85" />

  <!-- Planetary Ring -->
  <ellipse cx="50" cy="50" rx="46" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-22 50 50)" />
</svg>
