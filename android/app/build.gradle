import java.util.Properties
import java.io.FileInputStream
import java.security.MessageDigest

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.zoligamer.jupiter"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.zoligamer.jupiter"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        setProperty("archivesBaseName", "Jupiter")
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
    }
    buildTypes {
        release {
            if (keystoreProperties['storeFile'] && file(keystoreProperties['storeFile']).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Csak a release buildeket nevezzük át Jupiterre
            if (variant.buildType.name == "release") {
                // Megnézzük, melyik ABI (architektúra) épp a soros
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                def customName = ""

                if (abiFilter == "armeabi-v7a") {
                    customName = "Jupiter_ARM7.apk"
                } else if (abiFilter == "arm64-v8a") {
                    customName = "Jupiter_ARM8.apk"
                } else if (abiFilter == "x86_64") {
                    customName = "Jupiter_x86_64.apk"
                } else {
                    // Universal APK (ha nem split per abi)
                    customName = "Jupiter_Universal.apk"
                }

                outputFileName = customName
            }
        }

        // Automatikus SHA-256 fájl generálás minden elkészült APK-hoz
        variant.assembleProvider.configure { assembleTask ->
            assembleTask.doLast {
                variant.outputs.each { output ->
                    File apkFile = output.outputFile
                    if (apkFile != null && apkFile.exists()) {
                        MessageDigest digest = MessageDigest.getInstance("SHA-256")
                        apkFile.eachByte(4096) { buffer, length ->
                            digest.update(buffer, 0, length)
                        }
                        String sha256Hex = digest.digest().collect { String.format("%02x", it) }.join()
                        
                        // 1. Mentés a Gradle kimeneti mappába
                        File shaFile1 = new File(apkFile.parentFile, "${apkFile.name}.sha256")
                        shaFile1.text = "${sha256Hex}  ${apkFile.name}\n"

                        // 2. Mentés a Flutter flutter-apk mappájába is (pl. Jupiter_Universal.apk.sha256)
                        File flutterApkDir = new File(project.rootDir.parentFile, "build/app/outputs/flutter-apk")
                        if (!flutterApkDir.exists()) {
                            flutterApkDir.mkdirs()
                        }
                        File shaFile2 = new File(flutterApkDir, "${apkFile.name}.sha256")
                        shaFile2.text = "${sha256Hex}  ${apkFile.name}\n"

                        // Ha .apk végződésű, legeneráljuk a .apk nélküli változatot is (pl. Jupiter_Universal.sha256)
                        if (apkFile.name.endsWith(".apk")) {
                            String baseWithoutExt = apkFile.name.substring(0, apkFile.name.length() - 4)
                            File shaFileNoExt = new File(flutterApkDir, "${baseWithoutExt}.sha256")
                            shaFileNoExt.text = "${sha256Hex}  ${apkFile.name}\n"
                        }

                        // Ha app-release.apk vagy app-debug.apk néven is kéri valamilyen pipeline
                        File defaultApkSha = new File(flutterApkDir, "app-${variant.buildType.name}.apk.sha256")
                        defaultApkSha.text = "${sha256Hex}  app-${variant.buildType.name}.apk\n"

                        project.logger.lifecycle("SHA-256 generálva: ${shaFile1.name} -> ${sha256Hex}")
                    }
                }
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}

flutter {
    source '../..'
}
