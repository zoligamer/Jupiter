import java.util.Properties
import java.io.FileInputStream
import java.security.MessageDigest

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.zoligamer.jupiter"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.zoligamer.jupiter"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
    }
    buildTypes {
        release {
            if (keystoreProperties['storeFile'] && file(keystoreProperties['storeFile']).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Csak a release buildeket nevezzük át Jupiterre
            if (variant.buildType.name == "release") {
                // Megnézzük, melyik ABI (architektúra) épp a soros
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                def customName = ""

                if (abiFilter == "armeabi-v7a") {
                    customName = "Jupiter_ARM7.apk"
                } else if (abiFilter == "arm64-v8a") {
                    customName = "Jupiter_ARM8.apk"
                } else if (abiFilter == "x86_64") {
                    customName = "Jupiter_x86_64.apk"
                } else {
                    // Universal APK (ha nem split per abi)
                    customName = "Jupiter_Universal.apk"
                }

                outputFileName = customName
            }
        }

        // Automatikus SHA-256 fájl generálás minden elkészült APK-hoz
        variant.assembleProvider.configure { assembleTask ->
            if (variant.buildType.name == "release") {
                assembleTask.doFirst {
                    if (!keystoreProperties['storeFile'] || !file(keystoreProperties['storeFile']).exists()) {
                        throw new GradleException("Release build cannot proceed: 'android/key.properties' is missing or keystore file '${keystoreProperties['storeFile']}' does not exist. Refusing to sign release builds with debug keys.")
                    }
                }
            }
            assembleTask.doLast {
                variant.outputs.each { output ->
                    File apkFile = output.outputFile
                    if (apkFile != null && apkFile.exists()) {
                        MessageDigest digest = MessageDigest.getInstance("SHA-256")
                        apkFile.eachByte(4096) { buffer, length ->
                            digest.update(buffer, 0, length)
                        }
                        String sha256Hex = digest.digest().collect { String.format("%02x", it) }.join()
                        
                        // 1. Mentés a Gradle kimeneti mappába
                        File shaFile1 = new File(apkFile.parentFile, "${apkFile.name}.sha256")
                        shaFile1.text = "${sha256Hex}  ${apkFile.name}\n"

                        // 2. Mentés a Flutter flutter-apk mappájába is (pl. Jupiter_Universal.apk.sha256)
                        File flutterApkDir = new File(project.rootDir.parentFile, "build/app/outputs/flutter-apk")
                        if (!flutterApkDir.exists()) {
                            flutterApkDir.mkdirs()
                        }
                        File shaFile2 = new File(flutterApkDir, "${apkFile.name}.sha256")
                        shaFile2.text = "${sha256Hex}  ${apkFile.name}\n"

                        // 3. Mentés az alapértelmezett Flutter APK névhez is a flutter-apk mappában
                        // (pl. app-release.apk.sha256, app-arm64-v8a-release.apk.sha256, app-armeabi-v7a-release.apk.sha256, app-x86_64-release.apk.sha256)
                        def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                        String standardFlutterName = ""
                        if (abiFilter == "armeabi-v7a") {
                            standardFlutterName = "app-armeabi-v7a-${variant.buildType.name}.apk"
                        } else if (abiFilter == "arm64-v8a") {
                            standardFlutterName = "app-arm64-v8a-${variant.buildType.name}.apk"
                        } else if (abiFilter == "x86_64") {
                            standardFlutterName = "app-x86_64-${variant.buildType.name}.apk"
                        } else {
                            standardFlutterName = "app-${variant.buildType.name}.apk"
                        }
                        if (standardFlutterName != apkFile.name) {
                            File standardFlutterSha = new File(flutterApkDir, "${standardFlutterName}.sha256")
                            standardFlutterSha.text = "${sha256Hex}  ${standardFlutterName}\n"
                        }

                        project.logger.lifecycle("SHA-256 generálva: ${shaFile1.name} -> ${sha256Hex}")
                    }
                }
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}

flutter {
    source '../..'
}
