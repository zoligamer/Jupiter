import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.zoligamer.jupiter"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.zoligamer.jupiter"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        setProperty("archivesBaseName", "Jupiter")
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release // Ezt a sort add hozzá vagy módosítsd
            minifyEnabled true // Opcionális: extra tömörítés
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Csak a release buildeket nevezzük át
            if (variant.buildType.name == "release") {
                // Megnézzük, melyik ABI (architektúra) épp a soros
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                def customName = ""

                if (abiFilter == "armeabi-v7a") {
                    customName = "Neptun_Mobile_ARM7.apk"
                } else if (abiFilter == "arm64-v8a") {
                    customName = "Neptun_Mobile_ARM8.apk"
                } else if (abiFilter == "x86_64") {
                    customName = "Neptun_Mobile_x86_64.apk" // Ha esetleg ezt is buildelnéd
                } else {
                    // Fallback, ha valami más jönne ki (pl. universal apk)
                    customName = "Neptun_Mobile_Universal.apk"
                }

                // Csak akkor nevezzük át, ha meg tudtuk határozni az ABI-t
                if (abiFilter != null) {
                    outputFileName = customName
                }
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}

flutter {
    source '../..'
}
