name: Auto Update University TO Schedules

on:
  schedule:
    # Minden hétfőn éjjel 02:00-kor lefut automatikusan
    - cron: '0 2 * * 1'
  workflow_dispatch: # Kézzel is indítható bármikor a GitHub felületén

jobs:
  update-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run TO Schedule Verifier & Scraper
        run: |
          python .github/scripts/update_to_schedules.py
          
      - name: Commit & Push changes if updated # update kiterjed mindkét fájlra, mind gyökér mind asset/ mappába
        run: |
          # Átmásoljuk a frissített fájlt a gyökérbe is
          cp assets/universityNameUrlPairs.json universityNameUrlPairs.json

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Mindkettőt hozzáadjuk
          git add assets/universityNameUrlPairs.json universityNameUrlPairs.json
          
          # Ha bármelyik változott, mehet a commit és push
          git diff --staged --quiet || (git commit -m "Auto-update TO schedules and links" && git push)
